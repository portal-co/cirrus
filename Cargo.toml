[workspace]
members = ["crates/cirrus-asm", "crates/cirrus-core", "crates/cirrus-coroutine", "crates/cirrus-coroutine-selftest", "crates/ert/cirrus-ert-core", "crates/ert/cirrus-ert", "crates/ert/cirrus-armv8m-ert", "crates/ert/cirrus-ert-rt", "crates/ert/cirrus-ert-sha256-fixture", "crates/ert/cirrus-ert-selftest", "crates/ert/cirrus-armv8m-ert-selftest", "crates/garbled-circuit/cirrus-garbled-circuit", "crates/garbled-circuit/cirrus-garbled-circuit-row-reduced", "crates/garbled-circuit/cirrus-garbled-circuit-tinylabels", "crates/cirrus-mpc-common", "crates/cirrus-vole", "crates/miniot", "crates/recompile/cirrus-recompile-core", "crates/recompile/cirrus-recompile-bytecode", "crates/recompile/cirrus-recompile-rt", "crates/recompile/cirrus-llvm", "crates/recompile/cirrus-llvm-frontend", "crates/recompile/cirrus-llvm-pass-api", "crates/recompile/cirrus-llvm-pass", "crates/recompile/cirrus-rust-codegen", "crates/recompile/cirrus-recompile-tests", "crates/zk/cirrus-r1cs-backend", "crates/zk/cirrus-groth16", "crates/zk/cirrus-zk-tests", "crates/volar/cirrus-volar-boolar", "crates/volar/cirrus-volar-garble", "crates/volar/cirrus-volar-vole", "crates/volar/cirrus-spartan-whir"]
resolver = "3"

[workspace.package]
version = "0.1.0"
description = "New circuit compiler, for everywhere"

[workspace.dependencies]

portal-pc-asm-common = { version = "0.1.1", git = "https://github.com/portal-co/asm-common.git" }
portal-solutions-asm-x86-64 = { version = "0.1.0", git = "https://github.com/portal-co/asm-arch.git" }
portal-solutions-asm-riscv64 = { version = "0.1.0", git = "https://github.com/portal-co/asm-arch.git" }
portal-solutions-asm-aarch64 = { version = "0.1.0", git = "https://github.com/portal-co/asm-arch.git" }
portal-solutions-asm-jvm = { version = "0.1.0", git = "https://github.com/portal-co/asm-arch.git" }
portal-solutions-asm-regalloc = { git = "https://github.com/portal-co/asm-arch.git", package = "portal-solutions-asm-regalloc" }

rv-asm = { version = "*", git = "https://github.com/portal-co/rv-utils.git" }

# Recompile backends (LLVM / Rust-source / assembly codegen).
inkwell = { version = "0.10.0", default-features = false }
libloading = "0.8"

# arkworks (R1CS-synthesis + Groth16 ZK backend). All pinned to the same
# 0.6.0 release wave -- verify this stays true when bumping any one of them.
# `default-features = false` here so `cirrus-r1cs-backend` stays no_std+alloc;
# std-needing consumers (Groth16 proving, tests) opt back in with
# `features = ["std"]` on their own dependency entry.
ark-bn254 = { version = "0.6.0", default-features = false }
ark-ec = { version = "0.6.0", default-features = false }
ark-ff = { version = "0.6.0", default-features = false }
ark-groth16 = { version = "0.6.0", default-features = false }
ark-r1cs-std = { version = "0.6.0", default-features = false }
ark-relations = { version = "0.6.0", default-features = false }
ark-serialize = { version = "0.6.0", default-features = false }
ark-snark = { version = "0.6.0", default-features = false }
ark-std = { version = "0.6.0", default-features = false }

# volar-spec (cryptographic-protocol primitives: garbled circuits, VOLE-ZK).
# MUST use this exact ".git"-suffixed spelling: the volar patch block in
# ../.cargo/config.toml only declares
# [patch.'https://github.com/portal-co/volar.git'] (no unqualified-URL
# variant, unlike volar-ir/waffle-) -- do not add an unqualified-URL patch
# block for this; nothing needs it.
volar-spec = { version = "0.1.0", git = "https://github.com/portal-co/volar.git" }
# Pinned to match volar-spec's own Cargo.toml exactly.
cipher = { version = "0.5.1", default-features = false }
digest = { version = "0.11.3", default-features = false }
hybrid-array = { version = "0.4.8", default-features = false }

# Local Ferret / OT-stack APIs (Unpinned). Matches the `.git`-suffixed
# volar-spec dependency above; do not add an unqualified-URL patch.
[patch."https://github.com/portal-co/volar.git"]
volar-spec = { path = "../volar/crates/spec/volar-spec" }
