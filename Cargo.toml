[workspace]
members = ["crates/cirrus-asm", "crates/cirrus-core", "crates/ert/cirrus-ert-core", "crates/ert/cirrus-ert", "crates/ert/cirrus-armv8m-ert", "crates/ert/cirrus-ert-rt", "crates/ert/cirrus-ert-sha256-fixture", "crates/ert/cirrus-ert-selftest", "crates/ert/cirrus-armv8m-ert-selftest", "crates/garbled-circuit/cirrus-garbled-circuit", "crates/garbled-circuit/cirrus-garbled-circuit-row-reduced", "crates/garbled-circuit/cirrus-garbled-circuit-tinylabels", "crates/cirrus-mpc-common", "crates/cirrus-vole", "crates/miniot", "crates/recompile/cirrus-recompile-core", "crates/recompile/cirrus-recompile-rt", "crates/recompile/cirrus-llvm", "crates/recompile/cirrus-rust-codegen", "crates/recompile/cirrus-recompile-tests"]
resolver = "3"

[workspace.package]
version = "0.1.0"
description = "New circuit compiler, for everywhere"

[workspace.dependencies]

portal-pc-asm-common = { version = "0.1.1", git = "https://github.com/portal-co/asm-common.git" }
portal-solutions-asm-x86-64 = { version = "0.1.0", git = "https://github.com/portal-co/asm-arch.git" }
portal-solutions-asm-riscv64 = { version = "0.1.0", git = "https://github.com/portal-co/asm-arch.git" }
portal-solutions-asm-aarch64 = { version = "0.1.0", git = "https://github.com/portal-co/asm-arch.git" }
portal-solutions-asm-jvm = { version = "0.1.0", git = "https://github.com/portal-co/asm-arch.git" }
portal-solutions-asm-regalloc = { git = "https://github.com/portal-co/asm-arch", package = "portal-solutions-asm-regalloc" }

rv-asm = { version = "*", git = "https://github.com/portal-co/rv-utils.git" }

# Recompile backends (LLVM / Rust-source / assembly codegen).
inkwell = { version = "0.10.0", default-features = false }
libloading = "0.8"
