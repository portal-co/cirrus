[package]
name = "cirrus-volar-garble"
edition = "2024"
version.workspace = true
description.workspace = true

[dependencies]
cirrus-core = { version = "0.1.0", path = "../../cirrus-core" }
volar-spec.workspace = true
volar-oram.workspace = true
digest.workspace = true
hybrid-array.workspace = true
cipher.workspace = true
# Shared BitGC session framing/transport adapter. Explicitly opt-in; it does
# not enable the legacy reference backend or protected-session admission.
volar-mpc = { path = "../../../../volar-bitgc-session/crates/mpc/volar-mpc", default-features = false, optional = true }

[dev-dependencies]
cirrus-recompile-core = { version = "0.1.0", path = "../../recompile/cirrus-recompile-core" }
cirrus-recompile-rt = { version = "0.1.0", path = "../../recompile/cirrus-recompile-rt" }
cirrus-ert = { version = "0.1.0", path = "../../ert/cirrus-ert" }
rv-asm.workspace = true
sha2 = { version = "0.11.0", default-features = false }
cirrus-volar-boolar = { path = "../cirrus-volar-boolar" }
volar-ir = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }
volar-lir-test-corpus = { version = "0.1.0", git = "https://github.com/portal-co/volar-ir.git" }

[features]
default = []
# In-process/reference BitGC adapter only. Not a secure session protocol.
# TODO(provider-ledger: BITGC-LEDGER-07): remove after shared session lands.
bitgc-reference = ["volar-spec/bitgc-reference"]
# Thin Cirrus transport adapter over volar_mpc::bitgc_session. Correctness and
# bounded-channel integration only; no security/deployment claim.
bitgc-session = ["dep:volar-mpc"]
