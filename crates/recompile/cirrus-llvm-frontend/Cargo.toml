[package]
name = "cirrus-llvm-frontend"
edition = "2024"
version.workspace = true
description = "Bounded concrete-control LLVM IR frontend for Cirrus programs"

[dependencies]
cirrus-core = { version = "0.1.0", path = "../../cirrus-core" }
cirrus-recompile-core = { version = "0.1.0", path = "../cirrus-recompile-core" }
volar-llvm-import-core = { git = "https://github.com/portal-co/llvm-bridge.git" }
inkwell = { workspace = true, features = ["llvm22-1"] }
