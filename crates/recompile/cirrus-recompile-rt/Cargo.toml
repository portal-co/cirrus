[package]
name = "cirrus-recompile-rt"
edition = "2024"
version.workspace = true
description.workspace = true

[lib]
# A cdylib so the Rust-codegen backend's rustc-compiled artifact can link
# against a real shared object; rlib so cirrus-llvm/cirrus-asm can resolve
# these same symbols' addresses in-process for a JIT.
crate-type = ["cdylib", "rlib"]

[dependencies]
cirrus-core = { version = "0.1.0", path = "../../cirrus-core" }
cirrus-recompile-core = { version = "0.1.0", path = "../cirrus-recompile-core" }
cirrus-garbled-circuit = { version = "0.1.0", path = "../../garbled-circuit/cirrus-garbled-circuit", optional = true }
digest = { version = "0.11.3", optional = true }
sha2 = { version = "0.11.0", default-features = false, optional = true }

[features]
# The garbled-circuit garbler/evaluator pinned backends ("gc"/"eval"), on
# top of the always-available "plaintext" backend.
gc = ["dep:cirrus-garbled-circuit", "dep:digest", "dep:sha2"]

[dev-dependencies]
cirrus-core = { version = "0.1.0", path = "../../cirrus-core" }
