[package]
name = "cirrus-llvm-pass"
edition = "2024"
version.workspace = true
description = "LLVM 22 pass-plugin integration for Cirrus"
readme = "README.md"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
cirrus-llvm = { version = "0.1.0", path = "../cirrus-llvm" }
cirrus-llvm-frontend = { version = "0.1.0", path = "../cirrus-llvm-frontend" }
cirrus-llvm-pass-api = { version = "0.1.0", path = "../cirrus-llvm-pass-api" }
cirrus-recompile-core = { version = "0.1.0", path = "../cirrus-recompile-core" }
volar-llvm-constchain = { git = "https://github.com/portal-co/llvm-bridge" }
volar-llvm-pass-support = { path = "../../../../llvm-bridge/crates/volar-llvm-pass-support" }
inkwell = { workspace = true, features = ["llvm22-1"] }

[build-dependencies]
volar-llvm-pass-build = { path = "../../../../llvm-bridge/crates/volar-llvm-pass-build" }
