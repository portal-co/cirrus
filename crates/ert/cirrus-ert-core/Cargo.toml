[package]
name = "cirrus-ert-core"
edition = "2024"
version.workspace = true
description = "Shared symbolic-word execution support for cirrus ERT facades"

[dependencies]
cirrus-core = { version = "0.1.0", path = "../../cirrus-core" }
# Use the locally patched SSH spelling: the mpc workspace's .cargo config
# supplies the matching bridge checkout, avoiding a second same-version bridge
# package in the shared lockfile.
volar-circuit-exec-core = { git = "ssh://git@github.com/portal-co/llvm-bridge.git", default-features = false }
